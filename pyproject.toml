[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scentvec"
version = "1.0.0"
description = "An embedding model and search engine for finished perfumes, learned from their note pyramids."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.1",
]

[project.scripts]
scentvec = "scentvec.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["scentvec"]

[tool.setuptools.package-data]
scentvec = ["web/*.html"]
